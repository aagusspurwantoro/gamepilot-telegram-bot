[project]
name = "gamepilot-telegram-bot"
version = "1.1.0"
description = "Telegram bot: math calculator, BDO market tax, trash loot hours (plain and Agris), and silver progress"
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the logic modules
# no matter how pytest is invoked (bare `pytest`, CI, IDE runners).
pythonpath = ["."]
testpaths = ["tests"]
