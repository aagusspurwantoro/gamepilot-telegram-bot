[project]
name = "gamepilot-telegram-bot"
version = "1.2.0"
description = "Telegram bot: math calculator, BDO market tax, trash loot hours (plain and Agris), and silver/hours progress"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Flat layout: top-level logic modules, no package directory.
[tool.setuptools]
py-modules = ["bot", "calculator", "bdotax", "hourly", "hours", "agris", "progress"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# E501 (line length) is left to `ruff format`, like the Black convention.
ignore = ["E501"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the logic modules
# no matter how pytest is invoked (bare `pytest`, CI, IDE runners).
pythonpath = ["."]
testpaths = ["tests"]
