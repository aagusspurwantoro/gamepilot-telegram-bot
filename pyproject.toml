[project]
name = "gamepilot-telegram-bot"
version = "1.0.0"
description = "Telegram bot: calculator, BDO market tax calculator, and pilot workflow helpers"
license = {text = "MIT"}
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import calculator/bdotax
# no matter how pytest is invoked (bare `pytest`, CI, IDE runners).
pythonpath = ["."]
testpaths = ["tests"]
